name: Update flight prices

on:
  schedule:
    - cron: "0 13 * * *"   # daily at 13:00 UTC — adjust as you like
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run search script
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python scripts/search_flights.py

      - name: Commit updated results
        run: |
          git config user.name "flight-finder-bot"
          git config user.email "actions@github.com"
          git add docs/results.json
          git diff --staged --quiet || git commit -m "Update flight price data"
          git push
